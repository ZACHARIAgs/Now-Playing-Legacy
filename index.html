<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Now Playing">
    <title>Now Playing</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="icon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="icon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
    <!-- Background element -->
    <div id="background-container">
        <img id="background-image" src="" alt="">
    </div>

    <!-- Darkening overlay -->
    <div id="overlay"></div>

    <!-- Content container -->
    <div id="content-container">
        <div id="album-art-border">
            <img id="album-art" src="" alt="Album Art">
        </div>

        <div id="text-container">
            <div id="title-container" class="marquee-container">
                <div id="title-wrapper" class="marquee-wrapper">
                    <div id="title-text" class="marquee-text">Waiting for Spotify...</div>
                </div>
            </div>
            <div id="artist-container" class="marquee-container">
                <div id="artist-wrapper" class="marquee-wrapper">
                    <div id="artist-text" class="marquee-text-small"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Clock container -->
    <div id="clock-container">
        <!-- Style 0: Flip Clock -->
        <div id="clock-flip" class="clock-face">
            <div class="flip-unit" id="flip-hours">
                <div class="flip-card-top"><span>12</span></div>
                <div class="flip-card-bottom"><span>12</span></div>
                <div class="flip-leaf-top"><span>12</span></div>
                <div class="flip-leaf-bottom"><span>12</span></div>
                <div class="flip-card-divider"></div>
            </div>
            <div class="flip-unit" id="flip-minutes">
                <div class="flip-card-top"><span>00</span></div>
                <div class="flip-card-bottom"><span>00</span></div>
                <div class="flip-leaf-top"><span>00</span></div>
                <div class="flip-leaf-bottom"><span>00</span></div>
                <div class="flip-card-divider"></div>
            </div>
        </div>

        <!-- Style 1: Modern Rectangular Analog -->
        <div id="clock-analog" class="clock-face">
            <svg id="analog-svg" xmlns="http://www.w3.org/2000/svg">
                <g id="analog-ticks"></g>
                <line id="analog-hour-hand" x1="0" y1="0" x2="0" y2="0" />
                <line id="analog-minute-hand" x1="0" y1="0" x2="0" y2="0" />
                <g id="analog-second-group">
                    <line id="analog-second-hand" x1="0" y1="0" x2="0" y2="0" />
                    <circle id="analog-center-dot" cx="0" cy="0" r="6" />
                </g>
            </svg>
        </div>
    </div>

    <!-- Swipe Transition Overlay -->
    <div id="swipe-transition-overlay"></div>

    <!-- Status Popup -->
    <div id="status-popup"></div>

    <!-- Login Overlay -->
    <div id="login-overlay" style="display: none;">
        <h2>Connect to Spotify</h2>
        <button id="login-button" type="button">Log In with Spotify</button>
        <div id="import-box">
            <p class="import-hint">On iOS 9 / iPad mini 1, log in on a modern device with <code>?export=true</code> and paste the import link or refresh token below:</p>
            <input id="import-token-input" type="text" placeholder="Paste import link or refresh token">
            <button id="import-token-button" type="button">Import Token</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
